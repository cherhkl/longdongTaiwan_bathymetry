
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longdong Bay 3D Bathymetry Model</title>
    <!-- Load Plotly.js directly from a reliable CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        #plot-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="loading">Loading 3D Bathymetry Surface Model...</div>
    <div id="plot-container"></div>

    <script>
        // Fetch and render data dynamically
        fetch('bathymetry_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                Plotly.newPlot('plot-container', data.data, data.layout, {responsive: true});
            })
            .catch(error => {
                console.error('Error loading 3D data:', error);
                document.getElementById('loading').innerHTML = 
                    '<b style="color:red;">Error loading 3D dataset.</b><br>Please verify bathymetry_data.json is present in the repository.';
            });
    </script>
</body>
</html>
